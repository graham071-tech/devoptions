name: Build and backend type check

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/supabase-vercel-backend]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx tsc --noEmit -p tsconfig.server.json
